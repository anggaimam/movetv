plugins {
    id 'com.android.application'
}

android {
    namespace 'com.angga.movetv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.angga.movetv'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '0.5'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // Fixed personal key (created by the build and kept in its private cache) so updates install over old versions.
    signingConfigs {
        personal {
            storeFile file('movetv.keystore')
            storePassword 'movetv123'
            keyAlias 'movetv'
            keyPassword 'movetv123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.personal
        }
        debug {
            signingConfig signingConfigs.personal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'tflite'
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libtensorflowlite_jni.so']
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // TensorFlow Lite for MoveNet Lightning (fast 17-point body tracking)
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    testImplementation 'junit:junit:4.13.2'
}
