name: Build MoveTV APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # The signing key lives only in GitHub's private build cache (never in the public repo),
      # so updates install over each other. If the cache ever expires, uninstall MoveTV once.
      - uses: actions/cache@v4
        with:
          path: app/movetv.keystore
          key: movetv-signing-key-v1

      - name: Create signing key if missing
        run: |
          [ -f app/movetv.keystore ] || keytool -genkeypair -keystore app/movetv.keystore -alias movetv \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass movetv123 -keypass movetv123 \
            -dname "CN=MoveTV, O=Personal, C=CA"

      - name: Download body-tracking models (stored inside the app, used offline)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o app/src/main/assets/movenet_lightning.tflite "https://tfhub.dev/google/lite-model/movenet/singlepose/lightning/tflite/int8/4?lite-format=tflite"
          ls -la app/src/main/assets
          [ $(stat -c%s app/src/main/assets/movenet_lightning.tflite) -gt 1000000 ] || { echo "MoveNet download is not a model file"; head -c 300 app/src/main/assets/movenet_lightning.tflite; exit 1; }

      - name: Run unit tests
        run: |
          gradle testReleaseUnitTest --no-daemon
          echo "Unit test results:"
          grep -H -o '<testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' app/build/test-results/testReleaseUnitTest/*.xml

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk movetv.apk

      - name: Print APK permissions
        run: |
          ls -l movetv.apk
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump permissions movetv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: movetv-apk
          path: movetv.apk

      # Fixed link for Downloader:
      # https://github.com/<you>/<repo>/releases/latest/download/movetv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MoveTV build ${{ github.run_number }}
          files: movetv.apk
          make_latest: true
